services:
  postgres:
    image: postgres:15-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wylie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-wylie}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
