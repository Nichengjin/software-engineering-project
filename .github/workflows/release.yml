name: 发布

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 要创建的 release tag，例如 v0.1.0（手动触发时必填）
        required: true
      title:
        description: 给人看的发布标题
        required: false

permissions:
  contents: read

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22'
          cache: npm

      - name: 打包最终配置库并验证解包构建
        env:
          RELEASE_VERIFY_BUILD: '1'
        run: ./scripts/release-package.sh

      - name: 生成 SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false

      - name: 上传 release 产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            dist/wylie-college-source.tgz
            dist/release-manifest.json
            dist/config-items.json
            dist/sbom.spdx.json

      - name: 生成 build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: dist/wylie-college-source.tgz

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ inputs.title || env.RELEASE_TAG }}
          generate_release_notes: true
          # v1.0.0-rc.N 等带后缀的 tag 是交付候选，标为预发布。
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          files: |
            dist/wylie-college-source.tgz
            dist/release-manifest.json
            dist/config-items.json
            dist/sbom.spdx.json
