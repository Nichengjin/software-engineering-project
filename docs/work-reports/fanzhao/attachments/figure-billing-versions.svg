<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>账单到达顺序与当前应缴金额</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#355f87"/></marker><marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ad4c43"/></marker></defs><rect width="1200" height="760" fill="white"/><g font-family="PingFang SC,sans-serif" fill="#24364b"><text x="48" y="55" font-size="32" font-weight="600">账单到达顺序与当前应缴金额</text><text x="48" y="94" font-size="20" fill="#64748b">机制示意 · 同一学生、同一学期；每一版都表示完整应缴金额</text><text x="50" y="175" text-anchor="start" font-size="24" fill="#24364b">情形一：按版本顺序到达</text><line x1="302" y1="284" x2="468" y2="284" stroke="#355f87" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="220" width="250" height="156" rx="8" fill="#eef4f9" stroke="#cad4df"/><text x="170" y="255" text-anchor="middle" font-size="22" fill="#24364b">v1 到达</text><text x="170" y="304" text-anchor="middle" font-size="32" fill="#26756a">1200 元</text><text x="170" y="347" text-anchor="middle" font-size="19" fill="#64748b">首次应用</text><line x1="732" y1="284" x2="898" y2="284" stroke="#355f87" stroke-width="2" marker-end="url(#arrow)"/><rect x="475" y="220" width="250" height="156" rx="8" fill="#eef7f3" stroke="#cad4df"/><text x="600" y="255" text-anchor="middle" font-size="22" fill="#24364b">v2 到达</text><text x="600" y="304" text-anchor="middle" font-size="32" fill="#26756a">1500 元</text><text x="600" y="347" text-anchor="middle" font-size="19" fill="#64748b">替换旧版</text><rect x="905" y="220" width="250" height="156" rx="8" fill="#eef7f3" stroke="#cad4df"/><text x="1030" y="255" text-anchor="middle" font-size="22" fill="#24364b">v2 再次到达</text><text x="1030" y="304" text-anchor="middle" font-size="32" fill="#26756a">1500 元</text><text x="1030" y="347" text-anchor="middle" font-size="19" fill="#64748b">重复确认</text><text x="50" y="441" text-anchor="start" font-size="24" fill="#24364b">情形二：新版先到、旧版迟到</text><line x1="302" y1="550" x2="468" y2="550" stroke="#355f87" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="486" width="250" height="156" rx="8" fill="#eef4f9" stroke="#cad4df"/><text x="170" y="521" text-anchor="middle" font-size="22" fill="#24364b">v2 到达</text><text x="170" y="570" text-anchor="middle" font-size="32" fill="#26756a">1500 元</text><text x="170" y="613" text-anchor="middle" font-size="19" fill="#64748b">首次应用</text><line x1="732" y1="550" x2="898" y2="550" stroke="#355f87" stroke-width="2" marker-end="url(#arrow)"/><rect x="475" y="486" width="250" height="156" rx="8" fill="#eef7f3" stroke="#cad4df"/><text x="600" y="521" text-anchor="middle" font-size="22" fill="#24364b">v1 随后到达</text><text x="600" y="570" text-anchor="middle" font-size="32" fill="#26756a">1500 元</text><text x="600" y="613" text-anchor="middle" font-size="19" fill="#64748b">保留新版</text><rect x="905" y="486" width="250" height="156" rx="8" fill="#eef7f3" stroke="#cad4df"/><text x="1030" y="521" text-anchor="middle" font-size="22" fill="#24364b">v1 再次到达</text><text x="1030" y="570" text-anchor="middle" font-size="32" fill="#26756a">1500 元</text><text x="1030" y="613" text-anchor="middle" font-size="19" fill="#64748b">重复确认</text><text x="50" y="719" text-anchor="start" font-size="20" fill="#64748b">框中金额为接收端当前应缴总额；新版替换旧版，同版重发不累计金额。</text></g></svg>