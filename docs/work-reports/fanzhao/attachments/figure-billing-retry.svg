<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img"><title>账单已保存，但确认响应丢失</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#355f87"/></marker><marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ad4c43"/></marker></defs><rect width="1200" height="930" fill="white"/><g font-family="PingFang SC,sans-serif" fill="#24364b"><text x="48" y="55" font-size="32" font-weight="600">账单已保存，但确认响应丢失</text><text x="48" y="94" font-size="20" fill="#64748b">机制示意 · 重试沿用同一业务编号与完整账单内容</text><line x1="215" y1="174" x2="215" y2="845" stroke="#cad4df" stroke-width="2" stroke-dasharray="6 6"/><rect x="60" y="126" width="310" height="55" rx="8" fill="#eef4f9" stroke="#cad4df"/><text x="215" y="161.55" text-anchor="middle" font-size="23" fill="#24364b">业务后端</text><line x1="600" y1="174" x2="600" y2="845" stroke="#cad4df" stroke-width="2" stroke-dasharray="6 6"/><rect x="445" y="126" width="310" height="55" rx="8" fill="#eef4f9" stroke="#cad4df"/><text x="600" y="161.55" text-anchor="middle" font-size="23" fill="#24364b">计费模拟服务</text><line x1="985" y1="174" x2="985" y2="845" stroke="#cad4df" stroke-width="2" stroke-dasharray="6 6"/><rect x="830" y="126" width="310" height="55" rx="8" fill="#eef4f9" stroke="#cad4df"/><text x="985" y="161.55" text-anchor="middle" font-size="23" fill="#24364b">状态文件</text><line x1="215" y1="240" x2="600" y2="240" stroke="#355f87" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="407.5" y="226" text-anchor="middle" font-size="21" fill="#355f87">发送账单 v1</text><line x1="600" y1="320" x2="985" y2="320" stroke="#355f87" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="792.5" y="306" text-anchor="middle" font-size="21" fill="#355f87">写入、同步并原子替换</text><line x1="985" y1="399" x2="600" y2="399" stroke="#355f87" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="792.5" y="385" text-anchor="middle" font-size="21" fill="#355f87">账单与接收编号已保存</text><line x1="600" y1="483" x2="215" y2="483" stroke="#ad4c43" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#redarrow)"/><text x="407.5" y="469" text-anchor="middle" font-size="21" fill="#ad4c43">确认途中断连</text><path d="M 206 474 l18 18 m0 -18 l-18 18" stroke="#ad4c43" stroke-width="3"/><rect x="42.5" y="510" width="345" height="80" rx="8" fill="#fff3ed" stroke="#cad4df"/><text x="215" y="542" text-anchor="middle" font-size="20" fill="#24364b">记录发送失败</text><text x="215" y="572" text-anchor="middle" font-size="20" fill="#24364b">60 秒后具备重试资格</text><line x1="215" y1="665" x2="600" y2="665" stroke="#355f87" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="407.5" y="651" text-anchor="middle" font-size="21" fill="#355f87">重试相同编号、相同内容</text><line x1="600" y1="753" x2="215" y2="753" stroke="#355f87" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="407.5" y="739" text-anchor="middle" font-size="21" fill="#355f87">返回重复接收确认</text><rect x="50" y="796" width="1100" height="64" rx="8" fill="#eef7f3" stroke="#cad4df"/><text x="600" y="835.35" text-anchor="middle" font-size="21" fill="#24364b">后端标记送达；接收端最新应缴金额保持不变</text><text x="50" y="902" text-anchor="start" font-size="19" fill="#64748b">依据：外部系统报告 4.1—4.3、5.1 节；积压时仍需等待到期任务调度。</text></g></svg>