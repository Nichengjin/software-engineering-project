<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img"><title>旧读取响应晚于保存结果到达</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#355f87"/></marker><marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ad4c43"/></marker></defs><rect width="1200" height="810" fill="white"/><g font-family="PingFang SC,sans-serif" fill="#24364b"><text x="48" y="55" font-size="32" font-weight="600">旧读取响应晚于保存结果到达</text><text x="48" y="94" font-size="20" fill="#64748b">机制示意 · 收到较旧或相同版本时，保留当前副本</text><line x1="235" y1="174" x2="235" y2="725" stroke="#cad4df" stroke-width="2" stroke-dasharray="6 6"/><rect x="80" y="126" width="310" height="55" rx="8" fill="#eef4f9" stroke="#cad4df"/><text x="235" y="161.55" text-anchor="middle" font-size="23" fill="#24364b">学生页面</text><line x1="965" y1="174" x2="965" y2="725" stroke="#cad4df" stroke-width="2" stroke-dasharray="6 6"/><rect x="810" y="126" width="310" height="55" rx="8" fill="#eef4f9" stroke="#cad4df"/><text x="965" y="161.55" text-anchor="middle" font-size="23" fill="#24364b">服务器</text><line x1="235" y1="238" x2="965" y2="238" stroke="#355f87" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="600" y="224" text-anchor="middle" font-size="21" fill="#355f87">① 发起读取，服务器取得 v7</text><line x1="235" y1="329" x2="965" y2="329" stroke="#355f87" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="600" y="315" text-anchor="middle" font-size="21" fill="#355f87">② 发起保存</text><line x1="965" y1="420" x2="235" y2="420" stroke="#355f87" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="600" y="406" text-anchor="middle" font-size="21" fill="#355f87">③ 保存成功，返回 v8</text><rect x="75" y="445" width="320" height="78" rx="8" fill="#eef7f3" stroke="#cad4df"/><text x="235" y="476" text-anchor="middle" font-size="20" fill="#24364b">采用 v8</text><text x="235" y="506" text-anchor="middle" font-size="20" fill="#24364b">本地标记为已同步</text><line x1="965" y1="610" x2="235" y2="610" stroke="#355f87" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="600" y="596" text-anchor="middle" font-size="21" fill="#355f87">④ 先前的读取此时才返回 v7</text><rect x="50" y="639" width="370" height="92" rx="8" fill="#eef7f3" stroke="#cad4df"/><text x="235" y="677" text-anchor="middle" font-size="20" fill="#24364b">v7 低于当前 v8</text><text x="235" y="707" text-anchor="middle" font-size="20" fill="#24364b">忽略旧响应，页面保持 v8</text><text x="50" y="782" text-anchor="start" font-size="19" fill="#64748b">依据：学生端报告 4.2 节与 hooks.test.ts；箭头间距不表示真实耗时。</text></g></svg>