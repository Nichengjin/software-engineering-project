<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="885" viewBox="0 0 1200 885" role="img"><title>两个页面编辑同一份课表</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#355f87"/></marker><marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ad4c43"/></marker></defs><rect width="1200" height="885" fill="white"/><g font-family="PingFang SC,sans-serif" fill="#24364b"><text x="48" y="55" font-size="32" font-weight="600">两个页面编辑同一份课表</text><text x="48" y="94" font-size="20" fill="#64748b">机制示意 · 本地内容与开始编辑时的版本必须一起保留</text><line x1="215" y1="174" x2="215" y2="800" stroke="#cad4df" stroke-width="2" stroke-dasharray="6 6"/><rect x="60" y="126" width="310" height="55" rx="8" fill="#eef4f9" stroke="#cad4df"/><text x="215" y="161.55" text-anchor="middle" font-size="23" fill="#24364b">页面 A</text><line x1="600" y1="174" x2="600" y2="800" stroke="#cad4df" stroke-width="2" stroke-dasharray="6 6"/><rect x="445" y="126" width="310" height="55" rx="8" fill="#eef4f9" stroke="#cad4df"/><text x="600" y="161.55" text-anchor="middle" font-size="23" fill="#24364b">服务器</text><line x1="985" y1="174" x2="985" y2="800" stroke="#cad4df" stroke-width="2" stroke-dasharray="6 6"/><rect x="830" y="126" width="310" height="55" rx="8" fill="#eef4f9" stroke="#cad4df"/><text x="985" y="161.55" text-anchor="middle" font-size="23" fill="#24364b">页面 B</text><rect x="50" y="210" width="1100" height="64" rx="8" fill="#eef4f9" stroke="#cad4df"/><text x="600" y="249.35" text-anchor="middle" font-size="21" fill="#24364b">初始状态：两个页面均读取到 v51</text><rect x="825" y="297" width="320" height="78" rx="8" fill="#eef7f3" stroke="#cad4df"/><text x="985" y="328" text-anchor="middle" font-size="20" fill="#24364b">将主选改为三门</text><text x="985" y="358" text-anchor="middle" font-size="20" fill="#24364b">本地仍保留 v51</text><line x1="215" y1="332" x2="600" y2="332" stroke="#355f87" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="407.5" y="318" text-anchor="middle" font-size="21" fill="#355f87">提交修改，携带 v51</text><line x1="600" y1="422" x2="215" y2="422" stroke="#355f87" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="407.5" y="408" text-anchor="middle" font-size="21" fill="#355f87">保存成功，返回 v52</text><line x1="985" y1="510" x2="600" y2="510" stroke="#355f87" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="792.5" y="496" text-anchor="middle" font-size="21" fill="#355f87">轮询读取服务器课表</text><line x1="600" y1="598" x2="985" y2="598" stroke="#355f87" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="792.5" y="584" text-anchor="middle" font-size="21" fill="#355f87">返回 v52：四门主选</text><rect x="800" y="630" width="370" height="92" rx="8" fill="#eef7f3" stroke="#cad4df"/><text x="985" y="668" text-anchor="middle" font-size="20" fill="#24364b">保留三门本地编辑与 v51</text><text x="985" y="698" text-anchor="middle" font-size="20" fill="#24364b">提示冲突，暂停保存与提交</text><rect x="50" y="753" width="1100" height="64" rx="8" fill="#eef7f3" stroke="#cad4df"/><text x="600" y="792.35" text-anchor="middle" font-size="21" fill="#24364b">学生核对差异并确认采用 v52，随后重新编辑</text><text x="50" y="857" text-anchor="start" font-size="19" fill="#64748b">依据：学生端报告 4.1 节的 v51／v52 示例；不自动合并两份课表。</text></g></svg>